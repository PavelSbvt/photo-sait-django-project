<div  class="section_for_post_create">
    <form action="" method="POST" id="form-1" enctype="multipart/form-data">

<!--                <input type="text" name="title" id="title" class="form-control" required>-->

                    <label for="content" class="color_and_decorate_text_simple">Содержание</label>
                </div>
                <textarea name="content" id="content" rows="20" class="form-control" required></textarea>
            </div>
<!--            { form.as_p }}-->

                    <a>Добавить фото</a>

                </div>
            </div>
            <div class="width_button_in_form">

            </div>
        </div>
